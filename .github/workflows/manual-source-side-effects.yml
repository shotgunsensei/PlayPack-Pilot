name: Manual offline source side-effect checks

# This verifies the merge hook only. It is not full application CI.
# Canonical application tests/types/build need approved matching dependency
# assets and a separately reviewed CI implementation. No graph acquisition here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-source-side-effects-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-side-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
      COREPACK_ENABLE_NETWORK: "0"
      npm_config_offline: "true"
    steps:
      - name: Check out the selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check merge-hook syntax
        run: bash -n scripts/post-merge.sh
      - name: Verify source side effects using built-in Node modules
        run: node --test tests/post-merge-safety.test.cjs

